<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Interfaz web del detector de daños estructurales: foto de una pared analizada, diagnóstico del ensamble y comparación entre 4 redes neuronales">
  <rect width="800" height="500" fill="#0f172a" />

  <rect x="40" y="36" width="720" height="428" rx="16" fill="#111827" stroke="#1f2937" stroke-width="2" />
  <rect x="40" y="36" width="720" height="44" rx="16" fill="#1f2937" />
  <rect x="40" y="64" width="720" height="16" fill="#1f2937" />
  <g fill="#4b5563">
    <circle cx="68" cy="58" r="5" />
    <circle cx="86" cy="58" r="5" />
    <circle cx="104" cy="58" r="5" />
  </g>
  <rect x="132" y="50" width="220" height="16" rx="8" fill="#374151" />

  <!-- Panel izquierdo: foto subida de la pared -->
  <rect x="72" y="106" width="300" height="344" rx="12" fill="#1f2937" />
  <rect x="94" y="128" width="256" height="176" rx="8" fill="#374151" />
  <path d="M94 258 L150 198 L190 238 L230 188 L280 248 L350 198 L350 304 L94 304 Z" fill="#4b5563" />
  <path d="M170 228 L200 168 L210 258" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M240 210 L258 240" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Predicción del ensamble -->
  <rect x="94" y="318" width="256" height="60" rx="10" fill="#312e81" />
  <rect x="110" y="330" width="140" height="10" rx="5" fill="#a5b4fc" />
  <rect x="110" y="350" width="100" height="14" rx="7" fill="#ffffff" opacity="0.9" />
  <rect x="290" y="338" width="46" height="22" rx="11" fill="#dc2626" />

  <rect x="94" y="390" width="256" height="14" rx="7" fill="#4f46e5" />
  <rect x="94" y="414" width="180" height="10" rx="5" fill="#4b5563" />

  <!-- Panel derecho arriba: probabilidad por tipo de daño (varias clases) -->
  <g>
    <rect x="396" y="106" width="332" height="16" rx="8" fill="#1f2937" />
    <rect x="396" y="106" width="150" height="16" rx="8" fill="#a5b4fc" opacity="0.001" />
    <rect x="396" y="102" width="180" height="12" rx="6" fill="#a5b4fc" />

    <rect x="396" y="130" width="332" height="14" rx="7" fill="#1f2937" />
    <rect x="396" y="130" width="256" height="14" rx="7" fill="#dc2626" />

    <rect x="396" y="152" width="332" height="14" rx="7" fill="#1f2937" />
    <rect x="396" y="152" width="150" height="14" rx="7" fill="#f59e0b" />

    <rect x="396" y="174" width="332" height="14" rx="7" fill="#1f2937" />
    <rect x="396" y="174" width="96" height="14" rx="7" fill="#0d9488" />

    <rect x="396" y="196" width="332" height="14" rx="7" fill="#1f2937" />
    <rect x="396" y="196" width="60" height="14" rx="7" fill="#2dd4bf" />

    <rect x="396" y="218" width="332" height="14" rx="7" fill="#1f2937" />
    <rect x="396" y="218" width="34" height="14" rx="7" fill="#4b5563" />
  </g>

  <!-- Tabla de comparación entre las 4 arquitecturas -->
  <g>
    <rect x="396" y="254" width="332" height="200" rx="10" fill="#1f2937" />
    <rect x="414" y="272" width="220" height="12" rx="6" fill="#a5b4fc" />

    <rect x="414" y="298" width="296" height="1" fill="#374151" />
    <rect x="414" y="316" width="90" height="10" rx="5" fill="#9ca3af" />
    <rect x="560" y="316" width="60" height="10" rx="5" fill="#9ca3af" />
    <rect x="660" y="316" width="46" height="10" rx="5" fill="#9ca3af" />

    <rect x="414" y="340" width="1" height="1" fill="transparent" />
    <g fill="#4b5563">
      <rect x="414" y="340" width="90" height="10" rx="5" />
      <rect x="560" y="340" width="60" height="10" rx="5" fill="#dc2626" />
      <rect x="660" y="340" width="46" height="10" rx="5" />
    </g>
    <g fill="#4b5563">
      <rect x="414" y="364" width="90" height="10" rx="5" />
      <rect x="560" y="364" width="60" height="10" rx="5" fill="#dc2626" />
      <rect x="660" y="364" width="46" height="10" rx="5" />
    </g>
    <g fill="#4b5563">
      <rect x="414" y="388" width="90" height="10" rx="5" />
      <rect x="560" y="388" width="60" height="10" rx="5" fill="#f59e0b" />
      <rect x="660" y="388" width="46" height="10" rx="5" />
    </g>
    <g fill="#4b5563">
      <rect x="414" y="412" width="90" height="10" rx="5" />
      <rect x="560" y="412" width="60" height="10" rx="5" fill="#dc2626" />
      <rect x="660" y="412" width="46" height="10" rx="5" />
    </g>
  </g>
</svg>
