<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Agenda de citas de Jean Barber Atelier con horarios disponibles y pago con PayPal">
  <rect width="800" height="500" fill="#0f172a" />

  <rect x="40" y="36" width="720" height="428" rx="16" fill="#111827" stroke="#1f2937" stroke-width="2" />
